openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared admin session
  - name: dashboard
    description: Dashboard summaries
  - name: applicants
    description: Applicant review and ranking
  - name: imports
    description: CSV import workflow
  - name: queue
    description: Interview queue coordination
  - name: display
    description: Big-screen display state
  - name: assistant
    description: AI-assisted analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and grouped insights
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: List applicants with filters and sorting
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Grade"
        - $ref: "#/components/parameters/Recommendation"
        - $ref: "#/components/parameters/InterviewStatus"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/InvalidOnly"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Applicant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantList"
  /applicants/{id}:
    get:
      operationId: getApplicant
      tags: [applicants]
      summary: Get an applicant with transcript and notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplicant
      tags: [applicants]
      summary: Update ranking, category, status, or notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantUpdate"
      responses:
        "200":
          description: Updated applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
  /imports:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit a validated CSV import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /imports/preview:
    post:
      operationId: previewImport
      tags: [imports]
      summary: Preview a roster import and compare it with stored applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /imports/history:
    get:
      operationId: listImportHistory
      tags: [imports]
      summary: List previous roster imports and their diffs
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHistory"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [imports]
      summary: Request a private CSV upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: Get the current interview queue and active applicants
      responses:
        "200":
          description: Queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/advance:
    post:
      operationId: advanceQueue
      tags: [queue]
      summary: Finish one applicant and advance that applicant only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceQueueInput"
      responses:
        "200":
          description: Advanced queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/settings:
    post:
      operationId: updateQueueSettings
      tags: [queue]
      summary: Update interviewer labels used by the queue and display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueSettingsInput"
      responses:
        "200":
          description: Updated queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/reset:
    post:
      operationId: resetQueue
      tags: [queue]
      summary: Reset interview progress without deleting applicant data
      responses:
        "200":
          description: Reset queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/chat:
    get:
      operationId: getInterviewChat
      tags: [queue]
      summary: Get persisted interviewer chat
      responses:
        "200":
          description: Interviewer chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChat"
    post:
      operationId: sendInterviewChat
      tags: [queue]
      summary: Send a message to the other interviewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewChatInput"
      responses:
        "201":
          description: Sent chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChatMessage"
  /queue/reorder:
    post:
      operationId: reorderQueue
      tags: [queue]
      summary: Save the interview order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderQueueInput"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /display/state:
    get:
      operationId: getDisplayState
      tags: [display]
      summary: Get sanitized big-screen state
      responses:
        "200":
          description: Big-screen display state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayState"
  /assistant/ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the AI assistant about the current applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
  /assistant/history:
    get:
      operationId: getAssistantHistory
      tags: [assistant]
      summary: Get persisted assistant conversations
      responses:
        "200":
          description: Assistant conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantHistory"
    delete:
      operationId: clearAssistantHistory
      tags: [assistant]
      summary: Clear the persisted assistant conversation
      responses:
        "204":
          description: Assistant conversation cleared
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      tags: [assistant]
      summary: List saved assistant conversations
      responses:
        "200":
          description: Saved assistant conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationList"
    post:
      operationId: createAssistantConversation
      tags: [assistant]
      summary: Create an assistant conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConversationInput"
      responses:
        "201":
          description: Assistant conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
  /assistant/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/AssistantConversationId"
    patch:
      operationId: renameAssistantConversation
      tags: [assistant]
      summary: Rename an assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConversationUpdate"
      responses:
        "200":
          description: Renamed assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
    delete:
      operationId: deleteAssistantConversation
      tags: [assistant]
      summary: Delete an assistant conversation
      responses:
        "204":
          description: Assistant conversation deleted
  /assistant/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/AssistantConversationId"
    get:
      operationId: getAssistantConversationMessages
      tags: [assistant]
      summary: Get messages in an assistant conversation
      responses:
        "200":
          description: Assistant conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantHistory"
components:
  parameters:
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssistantConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      schema:
        type: string
    Grade:
      name: grade
      in: query
      schema:
        type: string
    Recommendation:
      name: recommendation
      in: query
      schema:
        type: string
    InterviewStatus:
      name: interviewStatus
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    InvalidOnly:
      name: invalidOnly
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    LoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    AuthSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        label:
          type: string
        token:
          type: string
          description: Session token for embedded clients that cannot use third-party cookies
    DashboardCount:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: integer
    DashboardSummary:
      type: object
      required:
        - total
        - reviewed
        - invalid
        - averageScore
        - scoreBuckets
        - recommendations
        - grades
        - commitments
        - interviewProgress
      properties:
        total:
          type: integer
        reviewed:
          type: integer
        invalid:
          type: integer
        averageScore:
          type: number
        scoreBuckets:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCount"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCount"
        grades:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCount"
        commitments:
          type: array
          items:
            $ref: "#/components/schemas/DashboardCount"
        interviewProgress:
          type: object
          required: [completed, remaining]
          properties:
            completed:
              type: integer
            remaining:
              type: integer
    Applicant:
      type: object
      required:
        - id
        - name
        - grade
        - aiScore
        - aiRecommendation
        - aiSummary
        - aiStrengths
        - aiConcerns
        - roboticsExperience
        - commit10Hours
        - parentVolunteer
        - interviewStatus
        - interviewer
         - interviewDecision
         - callbackRequested
        - category
        - rank
        - notes
        - queuePosition
      properties:
        id:
          type: string
        name:
          type: string
        grade:
          type: string
        email:
          type: ["string", "null"]
        transcript:
          type: ["string", "null"]
        aiScore:
          type: integer
        aiRecommendation:
          type: string
        aiSummary:
          type: string
        aiStrengths:
          type: string
        aiConcerns:
          type: string
        roboticsExperience:
          type: string
        commit10Hours:
          type: string
        parentVolunteer:
          type: string
        interviewStatus:
          type: string
        interviewer:
          type: string
        interviewDecision:
          type: string
        callbackRequested:
          type: boolean
        category:
          type: string
        rank:
          type: integer
        notes:
          type: string
        queuePosition:
          type: integer
    ApplicantList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Applicant"
        total:
          type: integer
    ApplicantUpdate:
      type: object
      properties:
        category:
          type: string
        rank:
          type: integer
        notes:
          type: string
        interviewStatus:
          type: string
        interviewer:
          type: string
        interviewDecision:
          type: string
        callbackRequested:
          type: boolean
        queuePosition:
          type: integer
    ImportInput:
      type: object
      required: [objectPath, fileName, rowCount]
      properties:
        objectPath:
          type: string
        fileName:
          type: string
        rowCount:
          type: integer
    ImportResult:
      type: object
      required: [importId, imported, skipped, delimiter, warnings, diff]
      properties:
        importId:
          type: string
        imported:
          type: integer
        skipped:
          type: integer
        delimiter:
          type: string
        warnings:
          type: array
          items:
            type: string
        diff:
          $ref: "#/components/schemas/ImportDiff"
    ImportPreview:
      type: object
      required: [delimiter, headers, rowCount, warnings, diff]
      properties:
        delimiter:
          type: string
        headers:
          type: array
          items:
            type: string
        rowCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
        diff:
          $ref: "#/components/schemas/ImportDiff"
    ImportDiff:
      type: object
      required: [added, updated, unchanged, missingFromUpload]
      properties:
        added:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        missingFromUpload:
          type: integer
    ImportHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [importId, fileName, rowCount, imported, skipped, delimiter, createdAt, diff]
            properties:
              importId:
                type: string
              fileName:
                type: string
              rowCount:
                type: integer
              imported:
                type: integer
              skipped:
                type: integer
              delimiter:
                type: string
              createdAt:
                type: string
              diff:
                $ref: "#/components/schemas/ImportDiff"
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
    UploadResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          required: [name, size, contentType]
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
    QueueState:
      type: object
      required: [currentApplicants, nextApplicants, interviewerLabels, completedCount, remainingCount, updatedAt]
      properties:
        currentApplicants:
          type: array
          items:
            $ref: "#/components/schemas/QueueApplicant"
        nextApplicants:
          type: array
          items:
            $ref: "#/components/schemas/QueueApplicant"
        interviewerLabels:
          type: array
          items:
            type: string
        completedCount:
          type: integer
        remainingCount:
          type: integer
        updatedAt:
          type: string
    QueueApplicant:
      type: object
      required: [id, name, grade, aiScore, category, queuePosition, interviewer, notes, interviewDecision, callbackRequested]
      properties:
        id:
          type: string
        name:
          type: string
        grade:
          type: string
        aiScore:
          type: integer
        category:
          type: string
        queuePosition:
          type: integer
        interviewer:
          type: string
        notes:
          type: string
        interviewDecision:
          type: string
        callbackRequested:
          type: boolean
    AdvanceQueueInput:
      type: object
      required: [applicantId]
      properties:
        applicantId:
          type: string
        note:
          type: string
    QueueSettingsInput:
      type: object
      required: [interviewerLabels]
      properties:
        interviewerLabels:
          type: array
          minItems: 1
          items:
            type: string
    InterviewChatInput:
      type: object
      required: [author, message]
      properties:
        author:
          type: string
        message:
          type: string
    InterviewChatMessage:
      type: object
      required: [id, author, message, createdAt]
      properties:
        id:
          type: string
        author:
          type: string
        message:
          type: string
        createdAt:
          type: string
    InterviewChat:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InterviewChatMessage"
    ReorderQueueInput:
      type: object
      required: [applicantIds]
      properties:
        applicantIds:
          type: array
          items:
            type: string
    DisplayState:
      type: object
      required: [mode, headline, subheadline, currentApplicants, updatedAt]
      properties:
        mode:
          type: string
        headline:
          type: string
        subheadline:
          type: string
        currentApplicants:
          type: array
          items:
            $ref: "#/components/schemas/DisplayApplicant"
        updatedAt:
          type: string
    DisplayApplicant:
      type: object
      required: [id, name, grade, lane]
      properties:
        id:
          type: string
        name:
          type: string
        grade:
          type: string
        lane:
          type: string
    AssistantInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
        conversationId:
          type: string
        applicantIds:
          type: array
          items:
            type: string
    AssistantResponse:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
    AssistantConversation:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messageCount:
          type: integer
    AssistantConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConversation"
    AssistantConversationInput:
      type: object
      properties:
        title:
          type: string
    AssistantConversationUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
    AssistantHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, question, answer, createdAt]
            properties:
              id:
                type: string
              question:
                type: string
              answer:
                type: string
              createdAt:
                type: string

