      required: [answer]
      properties:
        answer:
          type: string
        model:
          type: string
          description: "Model id used to produce the answer."
        activities:
          type: array
          items:
            $ref: "#/components/schemas/AssistantActivity"
    AssistantActivity:
      type: object
      required: [tool, detail]
      properties:
        tool:
          type: string
        detail:
          type: string
    GenerateImageInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        size:
          type: string
          description: "1024x1024 or 512x512"
    GenerateImageResult:
      type: object
      required: [imageUrl, prompt, seed]
      properties:
        imageUrl:
          type: string
        prompt:
          type: string
        seed:
          type: integer
    AssistantConversation:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        messageCount:
          type: integer
    AssistantConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantConversation"
    AssistantConversationInput:
      type: object
      properties:
        title:
          type: string
    AssistantConversationUpdate:
      type: object
      required: [title]
      properties:
        title:
          type: string
    AssistantConfig:
      type: object
      required: [textModel, visionModel]
      properties:
        textModel:
          type: string
          description: "Chat model answering assistant questions"
        visionModel:
          type: string
          description: "Vision model used for image input"
    AssistantModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        name:
          type: string
    AssistantModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistantModel"
    AssistantHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, question, answer, createdAt]
            properties:
              id:
                type: string
              question:
                type: string
              answer:
                type: string
              activities:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantActivity"
              createdAt:
                type: string
