openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared admin session
  - name: dashboard
    description: Dashboard summaries
  - name: applicants
    description: Applicant review and ranking
  - name: imports
    description: CSV import workflow
  - name: queue
    description: Interview queue coordination
  - name: display
    description: Big-screen display state
  - name: assistant
    description: AI-assisted analysis
  - name: system
    description: Service and usage info
  - name: cad
    description: CAD model library
  - name: workspaces
    description: Workspace visibility settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/usage:
    get:
      operationId: getSystemUsage
      tags: [system]
      summary: Supabase usage measured from the database vs plan quotas
      responses:
        "200":
          description: Usage numbers with quota limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUsage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an interviewer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/teams/random-code:
    get:
      operationId: getRandomTeamCode
      tags: [auth]
      summary: Generate a random team access code suggestion
      responses:
        "200":
          description: Random code suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RandomTeamCode"
  /auth/teams:
    post:
      operationId: createTeam
      tags: [auth]
      summary: Create a brand-new team with its own access code
      description: Creates a team plus its first coordinator account and signs that account in. The new team starts empty and is completely separate from every other team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateInput"
      responses:
        "201":
          description: Team created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamCreateResponse"
        "400":
          description: Invalid team name, code, or account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Team name or access code already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many teams created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-event-passcode:
    post:
      operationId: verifyEventPasscode
      tags: [auth]
      summary: Verify the team event passcode before showing account choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPasswordInput"
      responses:
        "200":
          description: Passcode verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamVerifyResponse"
        "400":
          description: Event passcode is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Incorrect event passcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect passcode attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/personal-notepad:
    get:
      operationId: getPersonalNotepad
      tags: [auth]
      summary: Get the signed-in account's private cloud notepad
      responses:
        "200":
          description: Notepad content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotepad"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePersonalNotepad
      tags: [auth]
      summary: Save the signed-in account's private cloud notepad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalNotepadInput"
      responses:
        "200":
          description: Saved notepad content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalNotepad"
        "400":
          description: Invalid note content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/team-branding:
    get:
      operationId: getTeamBranding
      tags: [auth]
      summary: Get branding for the signed-in team
      responses:
        "200":
          description: Current team's logo path and primary color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBranding"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTeamBranding
      tags: [auth]
      summary: Set or reset the signed-in team's primary color
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBranding"
      responses:
        "200":
          description: Updated team branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBranding"
        "400":
          description: Invalid branding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Coordinator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/team-branding/logo:
    post:
      operationId: uploadTeamLogo
      tags: [auth]
      summary: Upload a logo for the signed-in team
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Team logo saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTeamLogo"
        "400":
          description: Unsupported or invalid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Coordinator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: resetTeamLogo
      tags: [auth]
      summary: Reset the signed-in team's logo
      responses:
        "204":
          description: Team logo removed
        "403":
          description: Coordinator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/interviewers:
    get:
      operationId: listInterviewers
      tags: [auth]
      summary: List interviewer accounts and password setup state
      parameters:
        - name: eventPassword
          in: query
          required: false
          schema:
            type: string
          description: Team access code used to scope the list to one team. When omitted, the default team is listed so pre-migration clients keep working.
      responses:
        "200":
          description: Interviewer accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccountList"
    post:
      operationId: createInterviewer
      tags: [auth]
      summary: Create an interviewer account using the event passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewerInput"
      responses:
        "201":
          description: Created interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Account already exists or the password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no account was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/setup:
    post:
      operationId: setupInterviewerPassword
      tags: [auth]
      summary: Set the password for a legacy interviewer account using the event passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInterviewerPasswordInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Account already has a password or the password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no password was set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/{interviewerId}:
    delete:
      operationId: deleteInterviewer
      tags: [auth]
      summary: Delete an interviewer account and remove it from queue labels
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Interviewer deleted
        "404":
          description: Interviewer not found
  /auth/passkey/register/options:
    post:
      operationId: getPasskeyRegisterOptions
      tags: [auth]
      summary: WebAuthn options to register a passkey (coordinators only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Registration options for the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyPublicKeyOptions"
  /auth/passkey/register:
    post:
      operationId: registerPasskey
      tags: [auth]
      summary: Register a passkey for the signed-in account
      description: Requires a recent registration challenge issued by getPasskeyRegisterOptions.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationInput"
      responses:
        "201":
          description: Passkey stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredential"
        "400":
          description: The passkey could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/passkey/list:
    get:
      operationId: listPasskeys
      tags: [auth]
      summary: Passkeys registered to the signed-in account
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Registered passkeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCredentialList"
  /auth/passkey/{credentialId}:
    delete:
      operationId: deletePasskey
      tags: [auth]
      summary: Remove a passkey from the signed-in account
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Passkey removed
        "404":
          description: Passkey not found
  /auth/passkey/login/options:
    post:
      operationId: getPasskeyLoginOptions
      tags: [auth]
      summary: WebAuthn options to sign in with a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginChallengeInput"
      responses:
        "200":
          description: Assertion options for that account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyPublicKeyOptions"
        "401":
          description: Event passcode rejected
  /auth/passkey/login:
    post:
      operationId: loginWithPasskey
      tags: [auth]
      summary: Sign in with a passkey instead of a password
      description: Session issues exactly like the password login; password auth remains available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: The passkey was rejected
  /auth/interviewers/{interviewerId}/name:
    patch:
      operationId: updateInterviewerName
      tags: [auth]
      summary: Rename an interviewer (coordinators only)
      description: >-
        Updates the account, the interviewer labels used by queue assignment,
        chat authorship, and existing direct-message threads so history is
        preserved.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewerNameUpdateInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "404":
          description: Interviewer not found
        "409":
          description: Another interviewer already uses that name
  /auth/interviewers/{interviewerId}/role:
    patch:
      operationId: updateInterviewerRole
      tags: [auth]
      summary: Change an interviewer role (coordinators only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewerRoleUpdateInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "404":
          description: Interviewer not found
  /auth/interviewers/{interviewerId}/password:
    patch:
      operationId: updateInterviewerPassword
      tags: [auth]
      summary: Change or remove an interviewer password
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewerPasswordUpdateInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no password was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/passwords/reset-all:
    post:
      operationId: resetAllInterviewerPasswords
      tags: [auth]
      summary: Remove every interviewer password so setup is required again
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPasswordInput"
      responses:
        "200":
          description: Passwords reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and grouped insights
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /presence/heartbeat:
    post:
      operationId: postPresenceHeartbeat
      tags: [presence]
      summary: Record coordinator presence heartbeat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeatInput"
      responses:
        "200":
          description: Presence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceHeartbeat"
  /presence:
    get:
      operationId: getPresence
      tags: [presence]
      summary: List currently online coordinators
      responses:
        "200":
          description: Online presence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
  /presence/stats:
    get:
      operationId: getPresenceStats
      tags: [presence]
      summary: Per-IP usage stats from page-visit history
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage stats for one IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceIpStats"
  /presence/kick:
    post:
      operationId: kickPresence
      tags: [presence]
      summary: Kick all sessions from an IP (revoke + remove presence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceKickInput"
      responses:
        "200":
          description: Kick result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceKickResult"
  /broadcasts:
    post:
      operationId: postBroadcast
      tags: [broadcasts]
      summary: Send a popup broadcast to coordinators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
  /broadcasts/mine:
    get:
      operationId: getMyBroadcasts
      tags: [broadcasts]
      summary: List unacknowledged active popups for this session
      responses:
        "200":
          description: Pending popups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/commands:
    get:
      operationId: getBroadcastCommands
      tags: [broadcasts]
      summary: List unexpired big-screen commands (public; the display needs no login)
      parameters:
        - name: eventPassword
          in: query
          required: false
          schema:
            type: string
          description: Team access code to scope the public display to one team. Omitted = default team.
      responses:
        "200":
          description: Pending display commands, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/{broadcastId}/ack:
    post:
      operationId: ackBroadcast
      tags: [broadcasts]
      summary: Acknowledge a popup so it never shows again
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastAck"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: List applicants with filters and sorting
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Grade"
        - $ref: "#/components/parameters/Recommendation"
        - $ref: "#/components/parameters/InterviewStatus"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/InvalidOnly"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Applicant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantList"
  /applicants/search/ai:
    post:
      operationId: interpretApplicantSearch
      tags: [applicants]
      summary: Convert a natural-language request into applicant search syntax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantSearchAiInput"
      responses:
        "200":
          description: Interpreted applicant search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSearchAiResponse"
  /applicants/{id}:
    get:
      operationId: getApplicant
      tags: [applicants]
      summary: Get an applicant with transcript and notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplicant
      tags: [applicants]
      summary: Update ranking, category, status, or notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantUpdate"
      responses:
        "200":
          description: Updated applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
    delete:
      operationId: deleteApplicant
      tags: [applicants]
      summary: Delete an applicant permanently
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "204":
          description: Applicant deleted
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applicants/{id}/regenerate:
    post:
      operationId: regenerateApplicant
      tags: [applicants]
      summary: Regenerate AI score, recommendation, and readout from the transcript
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant with regenerated evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit a validated CSV import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /imports/preview:
    post:
      operationId: previewImport
      tags: [imports]
      summary: Preview a roster import and compare it with stored applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
