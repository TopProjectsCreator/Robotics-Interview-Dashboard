                $ref: "#/components/schemas/CodeDeployResult"
        "502":
          description: The hub could not be reached or refused the upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /code/projects/{projectId}/revisions:
    get:
      operationId: listCodeRevisions
      tags: [code]
      summary: List commit checkpoints for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRevisionList"
    post:
      operationId: createCodeRevision
      tags: [code]
      summary: Snapshot the project as a commit checkpoint
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRevisionInput"
      responses:
        "201":
          description: Created checkpoint
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision:
                    $ref: "#/components/schemas/CodeRevision"
  /code/projects/{projectId}/presence:
    get:
      operationId: listCodePresence
      tags: [code]
      summary: Who is currently in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active collaborators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodePresenceList"
    put:
      operationId: updateCodePresence
      tags: [code]
      summary: Publish where I am in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodePresenceInput"
      responses:
        "204":
          description: Presence updated
  /cad/library:
    get:
      operationId: listCadLibrary
      tags: [cad]
      summary: Load the whole CAD library in one request
      description: >
        Bots, folders, and models together, because the workspace renders the
        whole tree at once and three round trips would show a half-built tree.
      responses:
        "200":
          description: Bots with their folders and models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadLibrary"
  /cad/bots:
    post:
      operationId: createCadBot
      tags: [cad]
      summary: Create a bot to group CAD models
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadBotInput"
      responses:
        "201":
          description: Created bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadBot"
        "409":
          description: A bot with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCadBot
      tags: [cad]
      summary: Delete a bot, its folders, and its models
      description: Nested folders are removed with the bot. Models move to Unfiled and their files are deleted.
      parameters:
        - name: botId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Bot deleted
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cad/bots/{botId}:
    patch:
      operationId: updateCadBot
      tags: [cad]
      summary: Rename a bot or edit its notes
      parameters:
        - name: botId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadBotUpdateInput"
      responses:
        "200":
          description: Updated bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadBot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cad/folders:
    post:
      operationId: createCadFolder
      tags: [cad]
      summary: Create a folder inside a bot
      description: Omit parentId for a top-level folder. Subfolders nest to any depth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadFolderInput"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadFolder"
        "404":
          description: Bot or parent folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A sibling folder already has that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cad/folders/{folderId}:
    patch:
      operationId: updateCadFolder
      tags: [cad]
      summary: Rename a folder, move it, or nest it under another folder
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadFolderUpdateInput"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadFolder"
        "400":
          description: A folder cannot be moved inside itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Folder or new parent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCadFolder
      tags: [cad]
      summary: Delete a folder and its subfolders
      description: Contained models move to Unfiled rather than being deleted.
      parameters:
        - name: folderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Folder deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Folder not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cad/models:
    get:
      operationId: listCadModels
      tags: [cad]
      summary: List stored CAD models, optionally filtered by location
      parameters:
        - name: botId
          in: query
          required: false
          schema:
            type: string
        - name: folderId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CAD models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadModelList"
    post:
      operationId: createCadModel
      tags: [cad]
      summary: Record an uploaded CAD file in the library
      description: Call after the bytes are stored, then place the model in a bot or folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadModelInput"
      responses:
        "201":
          description: Created model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadModel"
        "400":
          description: Unknown location or unusable object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cad/models/{modelId}:
    patch:
      operationId: updateCadModel
      tags: [cad]
      summary: Rename a model, edit notes, or move it to another bot or folder
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadModelUpdateInput"
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadModel"
        "400":
          description: Unknown location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCadModel
      tags: [cad]
      summary: Delete a CAD model and its stored file
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Model and file deleted
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /parts/robots/{robotId}/parts/{partId}:
    put:
      operationId: setPartsRobotAllocation
      tags: [parts]
      summary: Set the number of catalog items assigned to a robot
      description: Set quantity to zero to remove the assignment. Total allocations cannot exceed owned stock.
      parameters:
        - name: robotId
          in: path
          required: true
          schema:
            type: string
        - name: partId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartsRobotAllocationInput"
      responses:
        "200":
          description: Updated robot allocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsRobotAllocation"
        "409":
          description: Allocation exceeds owned stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssistantConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      description: 'GitHub-style applicant search. Supports name:, age:, gender:, grade:, skill:, recommendation:, category:, status:, and invalid:true qualifiers, plus AND, OR, NOT, parentheses, IF...THEN, and free text.'
      schema:
        type: string
    Grade:
      name: grade
      in: query
      schema:
        type: string
    Recommendation:
      name: recommendation
      in: query
      schema:
        type: string
    InterviewStatus:
      name: interviewStatus
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    InvalidOnly:
      name: invalidOnly
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Before:
      name: before
      in: query
      description: Return messages created before this ISO timestamp (older history page).
      schema:
        type: string
    ChatLimit:
      name: limit
      in: query
      description: Max messages per page (1-100, default 30).
      schema:
        type: integer
  schemas:
    CustomMcpConnection:
      type: object
      required: [connected, endpointUrl]
      properties:
        connected:
          type: boolean
        endpointUrl:
          type: string
    CustomMcpConnectionInput:
      type: object
      required: [endpointUrl]
      properties:
        endpointUrl:
          type: string
          format: uri
          maxLength: 2048
    CustomMcpConnectResult:
      type: object
      required: [connected, endpointUrl]
      properties:
        connected:
          type: boolean
        endpointUrl:
          type: string
        authorizationUrl:
          type: ["string", "null"]
        toolCount:
          type: ["integer", "null"]
    PartsVendor:
      type: object
      required: [key, name, group, website, catalogMode, catalogSourceUrl, coverageState, lastSync]
      properties:
        key:
          type: string
        name:
          type: string
        group:
          type: string
          enum: [General Parts, Specific Parts, Machining Companies]
        website:
          type: string
          format: uri
        catalogMode:
          type: string
          enum: [products, custom_fabrication]
        catalogSourceUrl:
          type: string
          format: uri
          description: Official supplier catalog, product feed, or service source.
        coverageState:
          type: string
          enum: [feed_sync_required, discovery_only, access_restricted, custom_fabrication]
          description: Static source coverage classification; a public feed is complete only after sync verifies its final page.
        publicProductFeedUrl:
          type: [string, "null"]
          format: uri
          description: Configured supplier-owned public product feed, if available.
        lastSync:
          anyOf:
            - $ref: "#/components/schemas/PartsVendorSyncState"
            - type: "null"
          description: Latest persisted sync outcome, if this supplier has been checked.
    PartsVendorSyncState:
      type: object
      required: [status, checkedAt, itemCount, source, message]
      properties:
        status:
          type: string
          enum: [synced, search_only, unavailable, incomplete]
        checkedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          minimum: 0
          description: Number of supplier catalog records collected in the latest check.
        source:
          type: string
          format: uri
        message:
          type: string
    PartsRobot:
      type: object
      required: [id, name, preview, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        preview:
          anyOf:
            - $ref: "#/components/schemas/PartsRobotPreview"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartsRobotPreview:
      type: object
      required: [objectPath, fileName, contentType]
      properties:
        objectPath:
          type: string
          pattern: "^/objects/[A-Za-z0-9-]{8,128}$"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
    PartsRobotPreviewInput:
      type: object
      required: [objectPath, fileName, contentType]
      properties:
        objectPath:
          type: string
          pattern: "^/objects/[A-Za-z0-9-]{8,128}$"
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          maxLength: 100
    PartsRobotPreviewUpload:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          pattern: "^/objects/[A-Za-z0-9-]{8,128}$"
    PartsPriceSnapshot:
      type: object
      required: [id, partId, vendorKey, vendorName, sourceUrl, unitPrice, currency, capturedAt, isStartingAt, isStale]
      properties:
        id:
          type: string
        partId:
          type: string
        vendorKey:
          type: string
        vendorName:
          type: string
        sourceUrl:
          type: string
          format: uri
        unitPrice:
          type: number
          minimum: 0
          maximum: 99999999.99
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        capturedAt:
          type: string
          format: date-time
        isStartingAt:
          type: boolean
        isStale:
          type: boolean
    PartsPriceSnapshotInput:
      type: object
      required: [unitPrice, currency, sourceUrl, isStartingAt]
      properties:
        unitPrice:
          type: number
          minimum: 0
          maximum: 99999999.99
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        sourceUrl:
          type: string
          format: uri
          maxLength: 2000
        isStartingAt:
          type: boolean
    PartsRobotBuildPart:
      type: object
      required: [partId, name, vendorKey, vendorName, sku, productUrl, quantity, unitCost, costCurrency, lineTotal, priceSnapshots]
      properties:
        partId:
          type: string
        name:
          type: string
        vendorKey:
          type: string
        vendorName:
          type: string
        sku:
          type: [string, "null"]
        productUrl:
          type: [string, "null"]
          format: uri
        quantity:
          type: integer
          minimum: 1
        unitCost:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
        costCurrency:
          type: ["string", "null"]
          pattern: "^[A-Z]{3}$"
        lineTotal:
          type: ["number", "null"]
          minimum: 0
        priceSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/PartsPriceSnapshot"
    PartsRobotDetails:
      type: object
      required: [robot, parts, subtotalsByCurrency, unpricedPartCount]
      properties:
        robot:
          $ref: "#/components/schemas/PartsRobot"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartsRobotBuildPart"
        subtotalsByCurrency:
          type: array
          items:
            type: object
            required: [currency, amount]
            properties:
              currency:
                type: string
                pattern: "^[A-Z]{3}$"
              amount:
                type: number
                minimum: 0
        unpricedPartCount:
          type: integer
          minimum: 0
    PartsRobotAllocation:
      type: object
      required: [robotId, robotName, partId, quantity]
      properties:
        robotId:
          type: string
        robotName:
          type: string
        partId:
          type: string
        quantity:
          type: integer
          minimum: 0
    PartsCatalogItem:
      type: object
      required: [id, vendorKey, vendorName, name, sku, category, description, productUrl, imageUrl, quantityOwned, quantityAssigned, quantityAvailable, allocations, createdAt, updatedAt]
      properties:
        id:
          type: string
        vendorKey:
          type: string
        vendorName:
          type: string
        name:
          type: string
        sku:
          type: [string, "null"]
        category:
          type: [string, "null"]
        description:
          type: [string, "null"]
        productUrl:
          type: [string, "null"]
          format: uri
        imageUrl:
          type: [string, "null"]
          format: uri
        unitCost:
          type: ["number", "null"]
          minimum: 0
          maximum: 99999999.99
        costCurrency:
          type: ["string", "null"]
          pattern: "^[A-Z]{3}$"
        quantityOwned:
          type: integer
          minimum: 0
        quantityAssigned:
          type: integer
          minimum: 0
        quantityAvailable:
          type: integer
          minimum: 0
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/PartsRobotAllocation"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartsDashboard:
      type: object
      required: [vendors, robots, summary]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/PartsVendor"
        robots:
          type: array
          items:
            $ref: "#/components/schemas/PartsRobot"
        summary:
          type: object
          required: [vendorCount, catalogItems, ownedUnits, assignedUnits, availableUnits]
          properties:
            vendorCount:
              type: integer
            catalogItems:
              type: integer
            ownedUnits:
              type: integer
            assignedUnits:
              type: integer
            availableUnits:
              type: integer
    PartsCatalogList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PartsCatalogItem"
        total:
          type: integer
    PartsCatalogSearchResult:
      type: object
      required: [vendorKey, vendorName, title, url, description, sku, imageUrl, price, currency, priceIsStartingAt, inStock]
      properties:
        vendorKey:
          type: string
        vendorName:
          type: string
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
        sku:
          type: [string, "null"]
        imageUrl:
          type: [string, "null"]
          format: uri
        price:
          type: [string, "null"]
          pattern: '^\d{1,9}(\.\d{1,4})?$'
        currency:
          type: [string, "null"]
          pattern: '^[A-Z]{3}$'
        priceIsStartingAt:
          type: boolean
        inStock:
          type: boolean
          description: Whether the supplier page indicates the item is purchasable. True when availability is unknown or signals in-stock; false for explicit out-of-stock signals.
    PartsCatalogSearch:
      type: object
      required: [query, results, catalogItems, catalogTotal, catalogOffset, catalogLimit, liveSearchStatus]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/PartsCatalogSearchResult"
        catalogItems:
          type: array
          description: Matching saved catalog items from supplier feeds or team inventory, independently paginated from live discoveries.
          items:
            $ref: "#/components/schemas/PartsCatalogItem"
        catalogTotal:
          type: integer
        catalogOffset:
          type: integer
        catalogLimit:
          type: integer
        liveSearchStatus:
          type: string
          enum: [available, unavailable]
          description: Whether current live supplier-page discovery providers responded.
    PartsCatalogSearchStreamEvent:
      oneOf:
        - $ref: "#/components/schemas/PartsCatalogSearchStreamCatalogEvent"
        - $ref: "#/components/schemas/PartsCatalogSearchStreamResultEvent"
        - $ref: "#/components/schemas/PartsCatalogSearchStreamCompleteEvent"
      description: A newline-delimited event from the progressive supplier search.
    PartsCatalogSearchStreamCatalogEvent:
      type: object
      required: [type, query, catalogItems, catalogTotal, catalogOffset, catalogLimit]
      properties:
        type:
          type: string
          const: catalog
        query:
          type: string
        catalogItems:
          type: array
          items:
            $ref: "#/components/schemas/PartsCatalogItem"
        catalogTotal:
          type: integer
        catalogOffset:
          type: integer
        catalogLimit:
          type: integer
    PartsCatalogSearchStreamResultEvent:
      type: object
      required: [type, result]
      properties:
        type:
          type: string
          const: result
        result:
          $ref: "#/components/schemas/PartsCatalogSearchResult"
    PartsCatalogSearchStreamCompleteEvent:
      type: object
      required: [type, status, providerCount, failedProviderCount, resultCount]
      properties:
        type:
          type: string
          const: complete
        status:
          type: string
          enum: [available, partial, unavailable]
          description: Whether all live discovery providers responded successfully.
        providerCount:
          type: integer
          minimum: 0
        failedProviderCount:
          type: integer
          minimum: 0
        resultCount:
          type: integer
          minimum: 0
    PartsCatalogSyncVendor:
      type: object
      required: [vendorKey, vendorName, status, checkedAt, itemCount, created, updated, source, message]
      properties:
        vendorKey:
          type: string
        vendorName:
          type: string
        status:
          type: string
          enum: [synced, search_only, unavailable, incomplete]
        checkedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          minimum: 0
        created:
          type: integer
        updated:
          type: integer
        source:
          type: string
          format: uri
          description: Official product feed URL checked during sync, including an attempted supplier-owned Shopify feed.
        message:
          type: string
    PartsCatalogSyncResponse:
      type: object
      required: [vendors, totalItems, created, updated]
      properties:
        vendors:
          type: array
          items:
            $ref: "#/components/schemas/PartsCatalogSyncVendor"
        totalItems:
          type: integer
        created:
          type: integer
        updated:
          type: integer
    CreatePartsCatalogItemInput:
      type: object
      required: [vendorKey, name]
      properties:
        vendorKey:
          type: string
        name:
          type: string
        sku:
          type: [string, "null"]
        category:
          type: [string, "null"]
        description:
          type: [string, "null"]
        productUrl:
          type: [string, "null"]
          format: uri
        imageUrl:
          type: [string, "null"]
          format: uri
        quantityOwned:
          type: integer
          minimum: 0
          default: 0
    PartsCatalogImportItem:
      type: object
      required: [vendorKey, name]
      properties:
        vendorKey:
          type: string
        name:
          type: string
        externalKey:
          type: string
        sku:
          type: [string, "null"]
        category:
          type: [string, "null"]
        description:
          type: [string, "null"]
        productUrl:
          type: [string, "null"]
          format: uri
        imageUrl:
          type: [string, "null"]
          format: uri
        quantityOwned:
          type: integer
          minimum: 0
    PartsCatalogImportInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/PartsCatalogImportItem"
    PartsCatalogImportResponse:
      type: object
      required: [created, updated]
      properties:
        created:
          type: integer
        updated:
          type: integer
    PartsStockUpdateInput:
