openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared admin session
  - name: dashboard
    description: Dashboard summaries
  - name: applicants
    description: Applicant review and ranking
  - name: imports
    description: CSV import workflow
  - name: queue
    description: Interview queue coordination
  - name: display
    description: Big-screen display state
  - name: assistant
    description: AI-assisted analysis
  - name: system
    description: Service and usage info
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/usage:
    get:
      operationId: getSystemUsage
      tags: [system]
      summary: Supabase usage measured from the database vs plan quotas
      responses:
        "200":
          description: Usage numbers with quota limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUsage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an interviewer session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-event-passcode:
    post:
      operationId: verifyEventPasscode
      tags: [auth]
      summary: Verify the team event passcode before showing account choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPasswordInput"
      responses:
        "200":
          description: Passcode verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Event passcode is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Incorrect event passcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect passcode attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/interviewers:
    get:
      operationId: listInterviewers
      tags: [auth]
      summary: List interviewer accounts and password setup state
      responses:
        "200":
          description: Interviewer accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccountList"
    post:
      operationId: createInterviewer
      tags: [auth]
      summary: Create an interviewer account using the event passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewerInput"
      responses:
        "201":
          description: Created interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Account already exists or the password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no account was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/setup:
    post:
      operationId: setupInterviewerPassword
      tags: [auth]
      summary: Set the password for a legacy interviewer account using the event passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupInterviewerPasswordInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Account already has a password or the password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no password was set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/{interviewerId}:
    delete:
      operationId: deleteInterviewer
      tags: [auth]
      summary: Delete an interviewer account and remove it from queue labels
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Interviewer deleted
        "404":
          description: Interviewer not found
  /auth/interviewers/{interviewerId}/role:
    patch:
      operationId: updateInterviewerRole
      tags: [auth]
      summary: Change an interviewer role (coordinators only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewerRoleUpdateInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "404":
          description: Interviewer not found
  /auth/interviewers/{interviewerId}/password:
    patch:
      operationId: updateInterviewerPassword
      tags: [auth]
      summary: Change or remove an interviewer password
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: interviewerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewerPasswordUpdateInput"
      responses:
        "200":
          description: Updated interviewer account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewerAccount"
        "409":
          description: Password needs confirmation because it appeared 1–2 times in breach data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "422":
          description: Password appeared at least 3 times in breach data and is blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
        "503":
          description: Password safety service is unavailable; no password was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSafetyError"
  /auth/interviewers/passwords/reset-all:
    post:
      operationId: resetAllInterviewerPasswords
      tags: [auth]
      summary: Remove every interviewer password so setup is required again
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventPasswordInput"
      responses:
        "200":
          description: Passwords reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and grouped insights
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /presence/heartbeat:
    post:
      operationId: postPresenceHeartbeat
      tags: [presence]
      summary: Record coordinator presence heartbeat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeatInput"
      responses:
        "200":
          description: Presence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceHeartbeat"
  /presence:
    get:
      operationId: getPresence
      tags: [presence]
      summary: List currently online coordinators
      responses:
        "200":
          description: Online presence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
  /presence/stats:
    get:
      operationId: getPresenceStats
      tags: [presence]
      summary: Per-IP usage stats from page-visit history
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage stats for one IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceIpStats"
  /presence/kick:
    post:
      operationId: kickPresence
      tags: [presence]
      summary: Kick all sessions from an IP (revoke + remove presence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceKickInput"
      responses:
        "200":
          description: Kick result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceKickResult"
  /broadcasts:
    post:
      operationId: postBroadcast
      tags: [broadcasts]
      summary: Send a popup broadcast to coordinators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
  /broadcasts/mine:
    get:
      operationId: getMyBroadcasts
      tags: [broadcasts]
      summary: List unacknowledged active popups for this session
      responses:
        "200":
          description: Pending popups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/commands:
    get:
      operationId: getBroadcastCommands
      tags: [broadcasts]
      summary: List unexpired big-screen commands (public; the display needs no login)
      responses:
        "200":
          description: Pending display commands, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/{broadcastId}/ack:
    post:
      operationId: ackBroadcast
      tags: [broadcasts]
      summary: Acknowledge a popup so it never shows again
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastAck"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: List applicants with filters and sorting
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Grade"
        - $ref: "#/components/parameters/Recommendation"
        - $ref: "#/components/parameters/InterviewStatus"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/InvalidOnly"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Applicant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantList"
  /applicants/search/ai:
    post:
      operationId: interpretApplicantSearch
      tags: [applicants]
      summary: Convert a natural-language request into applicant search syntax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantSearchAiInput"
      responses:
        "200":
          description: Interpreted applicant search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSearchAiResponse"
  /applicants/{id}:
    get:
      operationId: getApplicant
      tags: [applicants]
      summary: Get an applicant with transcript and notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplicant
      tags: [applicants]
      summary: Update ranking, category, status, or notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantUpdate"
      responses:
        "200":
          description: Updated applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
    delete:
      operationId: deleteApplicant
      tags: [applicants]
      summary: Delete an applicant permanently
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "204":
          description: Applicant deleted
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applicants/{id}/regenerate:
    post:
      operationId: regenerateApplicant
      tags: [applicants]
      summary: Regenerate AI score, recommendation, and readout from the transcript
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant with regenerated evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit a validated CSV import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /imports/preview:
    post:
      operationId: previewImport
      tags: [imports]
      summary: Preview a roster import and compare it with stored applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /imports/history:
    get:
      operationId: listImportHistory
      tags: [imports]
      summary: List previous roster imports and their diffs
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHistory"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [imports]
      summary: Request a private CSV upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: Get the current interview queue and active applicants
      responses:
        "200":
          description: Queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/labels:
    get:
      operationId: getQueueLabels
      tags: [queue]
      summary: List interviewer labels (used for direct messages)
      responses:
        "200":
          description: Interviewer labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueLabels"
  /queue/advance:
    post:
      operationId: advanceQueue
      tags: [queue]
      summary: Finish one applicant and advance that applicant only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceQueueInput"
      responses:
        "200":
          description: Advanced queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/settings:
    post:
      operationId: updateQueueSettings
      tags: [queue]
      summary: Update interviewer labels used by the queue and display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueSettingsInput"
      responses:
        "200":
          description: Updated queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/reset:
    post:
      operationId: resetQueue
      tags: [queue]
      summary: Reset interview progress without deleting applicant data
      responses:
        "200":
          description: Reset queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/chat:
    get:
      operationId: getInterviewChat
      tags: [queue]
      summary: Get persisted interviewer chat
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/ChatLimit"
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [shared, direct]
            default: shared
          description: Conversation scope. Shared is the team channel; direct requires author and peer.
        - name: author
          in: query
          required: false
          schema:
            type: string
          description: Configured interviewer label used to derive a direct conversation pair.
        - name: peer
          in: query
          required: false
          schema:
            type: string
          description: Configured interviewer label for the direct conversation.
      responses:
        "200":
          description: Interviewer chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChat"
    post:
      operationId: sendInterviewChat
      tags: [queue]
      summary: Send a message to the other interviewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewChatInput"
      responses:
        "200":
          description: Previously saved message returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChatMessage"
        "201":
          description: Sent chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChatMessage"
  /queue/custom-emojis:
    get:
      operationId: listChatCustomEmojis
      tags: [queue]
      summary: List team-shared custom chat emojis
      responses:
        "200":
          description: Custom emojis available to signed-in interviewers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCustomEmojiList"
    post:
      operationId: uploadChatCustomEmoji
      tags: [queue]
      summary: Upload a team-shared custom chat emoji
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCustomEmojiInput"
      responses:
        "201":
          description: Uploaded custom emoji
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCustomEmoji"
  /queue/chat/conversations:
    get:
      operationId: getChatConversations
      tags: [queue]
      summary: List direct conversations involving the current interviewer
      responses:
        "200":
          description: Direct conversation summaries, newest activity first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationList"
  /queue/chat/{messageId}/reactions:
    post:
      operationId: toggleChatReaction
      tags: [queue]
      summary: Toggle an emoji reaction on a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReactionInput"
      responses:
        "200":
          description: Updated reaction list for the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReactionList"
  /queue/chat/{messageId}/pin:
    post:
      operationId: toggleChatMessagePin
      tags: [queue]
      summary: Toggle the pinned state of a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated pinned state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePin"
  /queue/chat/{messageId}:
    patch:
      operationId: updateChatMessage
      tags: [queue]
      summary: Edit a chat message created by the signed-in interviewer
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageUpdateInput"
      responses:
        "200":
          description: Updated chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChatMessage"
    delete:
      operationId: deleteChatMessage
      tags: [queue]
      summary: Delete a chat message and its reactions
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Message deleted
  /whiteboards:
    get:
      operationId: listInterviewWhiteboards
      tags: [queue]
      summary: List whiteboards available in the current interviewer conversation
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [shared, direct]
            default: shared
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: peer
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Available interviewer whiteboards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewWhiteboardList"
    post:
      operationId: createInterviewWhiteboard
      tags: [queue]
      summary: Create a whiteboard in the current interviewer conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewWhiteboardInput"
      responses:
        "201":
          description: Created interviewer whiteboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewWhiteboard"
  /whiteboards/{whiteboardId}:
    get:
      operationId: getInterviewWhiteboardById
      tags: [queue]
      summary: Get an interviewer whiteboard
      parameters:
        - name: whiteboardId
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [shared, direct]
            default: shared
        - name: author
          in: query
          required: false
          schema:
            type: string
        - name: peer
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Interviewer whiteboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewWhiteboard"
    patch:
      operationId: updateInterviewWhiteboard
      tags: [queue]
      summary: Save an interviewer whiteboard
      parameters:
        - name: whiteboardId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewWhiteboardUpdateInput"
      responses:
        "200":
          description: Updated interviewer whiteboard
          content:
