      operationId: searchPartsCatalogStream
      tags: [parts]
      summary: Stream verified supplier search results as they are found
      description: Returns newline-delimited JSON events. The catalog event arrives first, zero or more verified result events follow while providers and official product pages are processed, and one complete event reports available, partial, or unavailable provider status. Existing JSON search callers should continue using /parts/catalog/search.
      parameters:
        - name: vendorKey
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
