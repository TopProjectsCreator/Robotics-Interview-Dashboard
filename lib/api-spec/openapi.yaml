  /storage/cad-models:
    post:
      operationId: uploadCadModelFile
      tags: [storage]
      summary: Upload a CAD workspace file (CAD model or reference file)
      description: >
        Stores a validated CAD workspace file as a private object and returns
        its path. Accepts CAD models (GLB, STL, OBJ, PLY, 3MF, STEP, IGES,
        BREP, X_T, X_B) plus reference files (images, videos, audio, PDFs,
        documents, presentations, spreadsheets, text) so robot designs in any
        format live side by side. The file name decides the renderer, so the
        extension must match the bytes. Large files should use the chunked
        upload endpoints instead.
      parameters:
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            maxLength: 255
        - name: contentType
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: CAD model object stored successfully
          content:
