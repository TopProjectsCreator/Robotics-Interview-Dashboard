openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Shared admin session
  - name: dashboard
    description: Dashboard summaries
  - name: applicants
    description: Applicant review and ranking
  - name: imports
    description: CSV import workflow
  - name: queue
    description: Interview queue coordination
  - name: display
    description: Big-screen display state
  - name: assistant
    description: AI-assisted analysis
  - name: system
    description: Service and usage info
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /system/usage:
    get:
      operationId: getSystemUsage
      tags: [system]
      summary: Supabase usage measured from the database vs plan quotas
      responses:
        "200":
          description: Usage numbers with quota limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUsage"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get the current admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and grouped insights
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /presence/heartbeat:
    post:
      operationId: postPresenceHeartbeat
      tags: [presence]
      summary: Record coordinator presence heartbeat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeatInput"
      responses:
        "200":
          description: Presence recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceHeartbeat"
  /presence:
    get:
      operationId: getPresence
      tags: [presence]
      summary: List currently online coordinators
      responses:
        "200":
          description: Online presence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
  /presence/stats:
    get:
      operationId: getPresenceStats
      tags: [presence]
      summary: Per-IP usage stats from page-visit history
      parameters:
        - name: ip
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Usage stats for one IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceIpStats"
  /presence/kick:
    post:
      operationId: kickPresence
      tags: [presence]
      summary: Kick all sessions from an IP (revoke + remove presence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceKickInput"
      responses:
        "200":
          description: Kick result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceKickResult"
  /broadcasts:
    post:
      operationId: postBroadcast
      tags: [broadcasts]
      summary: Send a popup broadcast to coordinators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "201":
          description: Broadcast created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
  /broadcasts/mine:
    get:
      operationId: getMyBroadcasts
      tags: [broadcasts]
      summary: List unacknowledged active popups for this session
      responses:
        "200":
          description: Pending popups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/commands:
    get:
      operationId: getBroadcastCommands
      tags: [broadcasts]
      summary: List unexpired big-screen commands (public; the display needs no login)
      responses:
        "200":
          description: Pending display commands, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
  /broadcasts/{broadcastId}/ack:
    post:
      operationId: ackBroadcast
      tags: [broadcasts]
      summary: Acknowledge a popup so it never shows again
      parameters:
        - name: broadcastId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastAck"
  /applicants:
    get:
      operationId: listApplicants
      tags: [applicants]
      summary: List applicants with filters and sorting
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Grade"
        - $ref: "#/components/parameters/Recommendation"
        - $ref: "#/components/parameters/InterviewStatus"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/InvalidOnly"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Applicant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantList"
  /applicants/search/ai:
    post:
      operationId: interpretApplicantSearch
      tags: [applicants]
      summary: Convert a natural-language request into applicant search syntax
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantSearchAiInput"
      responses:
        "200":
          description: Interpreted applicant search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantSearchAiResponse"
  /applicants/{id}:
    get:
      operationId: getApplicant
      tags: [applicants]
      summary: Get an applicant with transcript and notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplicant
      tags: [applicants]
      summary: Update ranking, category, status, or notes
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantUpdate"
      responses:
        "200":
          description: Updated applicant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
    delete:
      operationId: deleteApplicant
      tags: [applicants]
      summary: Delete an applicant permanently
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "204":
          description: Applicant deleted
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applicants/{id}/regenerate:
    post:
      operationId: regenerateApplicant
      tags: [applicants]
      summary: Regenerate AI score, recommendation, and readout from the transcript
      parameters:
        - $ref: "#/components/parameters/ApplicantId"
      responses:
        "200":
          description: Applicant with regenerated evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Applicant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /imports:
    post:
      operationId: commitImport
      tags: [imports]
      summary: Commit a validated CSV import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "201":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
  /imports/preview:
    post:
      operationId: previewImport
      tags: [imports]
      summary: Preview a roster import and compare it with stored applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
  /imports/history:
    get:
      operationId: listImportHistory
      tags: [imports]
      summary: List previous roster imports and their diffs
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportHistory"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [imports]
      summary: Request a private CSV upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
  /queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: Get the current interview queue and active applicants
      responses:
        "200":
          description: Queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/advance:
    post:
      operationId: advanceQueue
      tags: [queue]
      summary: Finish one applicant and advance that applicant only
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceQueueInput"
      responses:
        "200":
          description: Advanced queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/settings:
    post:
      operationId: updateQueueSettings
      tags: [queue]
      summary: Update interviewer labels used by the queue and display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueSettingsInput"
      responses:
        "200":
          description: Updated queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/reset:
    post:
      operationId: resetQueue
      tags: [queue]
      summary: Reset interview progress without deleting applicant data
      responses:
        "200":
          description: Reset queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/chat:
    get:
      operationId: getInterviewChat
      tags: [queue]
      summary: Get persisted interviewer chat
      parameters:
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/ChatLimit"
      responses:
        "200":
          description: Interviewer chat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChat"
    post:
      operationId: sendInterviewChat
      tags: [queue]
      summary: Send a message to the other interviewer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewChatInput"
      responses:
        "201":
          description: Sent chat message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewChatMessage"
  /queue/chat/{messageId}/reactions:
    post:
      operationId: toggleChatReaction
      tags: [queue]
      summary: Toggle an emoji reaction on a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReactionInput"
      responses:
        "200":
          description: Updated reaction list for the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReactionList"
  /queue/chat/{messageId}/pin:
    post:
      operationId: toggleChatMessagePin
      tags: [queue]
      summary: Toggle the pinned state of a chat message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated pinned state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePin"
  /queue/chat/{messageId}:
    delete:
      operationId: deleteChatMessage
      tags: [queue]
      summary: Delete a chat message and its reactions
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Message deleted
  /queue/reorder:
    post:
      operationId: reorderQueue
      tags: [queue]
      summary: Save the interview order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderQueueInput"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /queue/callback:
    post:
      operationId: callbackQueue
      tags: [queue]
      summary: Recall a finished applicant to the front of the queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueCallbackInput"
      responses:
        "200":
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
  /display/state:
    get:
      operationId: getDisplayState
      tags: [display]
      summary: Get sanitized big-screen state
      responses:
        "200":
          description: Big-screen display state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayState"
  /display/settings:
    get:
      operationId: getDisplaySettings
      tags: [display]
      summary: Get big-screen text and announcement settings
      responses:
        "200":
          description: Display settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplaySettings"
    post:
      operationId: updateDisplaySettings
      tags: [display]
      summary: Update big-screen text, name pills, and announcements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplaySettingsInput"
      responses:
        "200":
          description: Updated display settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplaySettings"
  /seating/settings:
    get:
      operationId: getSeatingSettings
      tags: [seating]
      summary: Get seating chart dimensions
      responses:
        "200":
          description: Seating settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingSettings"
    post:
      operationId: updateSeatingSettings
      tags: [seating]
      summary: Resize the seating chart (out-of-bounds seats are cleared)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingSettingsInput"
      responses:
        "200":
          description: Updated seating settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingSettings"
  /seating/assign:
    post:
      operationId: assignSeat
      tags: [seating]
      summary: Seat an applicant (occupant swaps into their old seat; row/col -1 unseats)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingAssignInput"
      responses:
        "200":
          description: Seat assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
  /assistant/ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the AI assistant about the current applicants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
  /assistant/images:
    post:
      operationId: generateAssistantImage
      tags: [assistant]
      summary: Generate an AI image from a coordinator prompt (keyless provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageInput"
      responses:
        "201":
          description: Generated image URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateImageResult"
  /dashboard/charts:
    get:
      operationId: listDashboardCharts
      tags: [dashboard]
      summary: List saved custom dashboard charts
      responses:
        "200":
          description: Saved custom charts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardChartList"
    post:
      operationId: createDashboardChart
      tags: [dashboard]
      summary: Save a custom dashboard chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardChartInput"
      responses:
        "201":
          description: Created custom chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardChart"
  /dashboard/charts/{chartId}:
    parameters:
      - name: chartId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateDashboardChart
      tags: [dashboard]
      summary: Update a custom dashboard chart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardChartUpdate"
      responses:
        "200":
          description: Updated custom chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardChart"
        "404":
          description: Chart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDashboardChart
      tags: [dashboard]
      summary: Delete a custom dashboard chart
      responses:
        "204":
          description: Chart deleted
        "404":
          description: Chart not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List data snapshots (newest first, no payloads)
      responses:
        "200":
          description: Snapshot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotList"
    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Capture a snapshot of the current data
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "201":
          description: Created snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
  /snapshots/{snapshotId}/restore:
    parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restoreSnapshot
      tags: [snapshots]
      summary: Restore a snapshot (current state is saved first as a new snapshot)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRestoreInput"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotRestoreResult"
        "404":
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/history:
    get:
      operationId: getAssistantHistory
      tags: [assistant]
      summary: Get persisted assistant conversations
      responses:
        "200":
          description: Assistant conversation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantHistory"
    delete:
      operationId: clearAssistantHistory
      tags: [assistant]
      summary: Clear the persisted assistant conversation
      responses:
        "204":
          description: Assistant conversation cleared
  /assistant/config:
    get:
      operationId: getAssistantConfig
      tags: [assistant]
      summary: Get AI assistant model configuration
      responses:
        "200":
          description: Model names used by the assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConfig"
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      tags: [assistant]
      summary: List saved assistant conversations
      responses:
        "200":
          description: Saved assistant conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationList"
    post:
      operationId: createAssistantConversation
      tags: [assistant]
      summary: Create an assistant conversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConversationInput"
      responses:
        "201":
          description: Assistant conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
  /assistant/conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/AssistantConversationId"
    patch:
      operationId: renameAssistantConversation
      tags: [assistant]
      summary: Rename an assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantConversationUpdate"
      responses:
        "200":
          description: Renamed assistant conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
    delete:
      operationId: deleteAssistantConversation
      tags: [assistant]
      summary: Delete an assistant conversation
      responses:
        "204":
          description: Assistant conversation deleted
  /assistant/conversations/{conversationId}/messages:
    get:
      operationId: getAssistantConversationMessages
      tags: [assistant]
      summary: Get messages in an assistant conversation
      parameters:
        - $ref: "#/components/parameters/AssistantConversationId"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/ChatLimit"
      responses:
        "200":
          description: Assistant conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantHistory"
components:
  parameters:
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssistantConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      description: 'GitHub-style applicant search. Supports name:, age:, gender:, grade:, skill:, recommendation:, category:, status:, and invalid:true qualifiers, plus AND, OR, NOT, parentheses, IF...THEN, and free text.'
      schema:
        type: string
    Grade:
      name: grade
      in: query
      schema:
        type: string
    Recommendation:
      name: recommendation
      in: query
      schema:
        type: string
    InterviewStatus:
      name: interviewStatus
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    InvalidOnly:
      name: invalidOnly
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Before:
      name: before
      in: query
      description: Return messages created before this ISO timestamp (older history page).
      schema:
        type: string
