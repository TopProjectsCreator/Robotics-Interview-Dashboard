              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ApplicantId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AssistantConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      description: 'GitHub-style applicant search. Supports name:, age:, gender:, grade:, skill:, recommendation:, category:, status:, and invalid:true qualifiers, plus AND, OR, NOT, parentheses, IF...THEN, and free text.'
      schema:
        type: string
    Grade:
      name: grade
      in: query
      schema:
        type: string
    Recommendation:
      name: recommendation
      in: query
      schema:
        type: string
    InterviewStatus:
      name: interviewStatus
      in: query
      schema:
        type: string
    Category:
      name: category
      in: query
      schema:
        type: string
    InvalidOnly:
      name: invalidOnly
      in: query
      schema:
        type: boolean
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Before:
      name: before
      in: query
      description: Return messages created before this ISO timestamp (older history page).
      schema:
        type: string
    ChatLimit:
      name: limit
      in: query
      description: Max messages per page (1-100, default 30).
      schema:
        type: integer
  schemas:
    PartsVendor:
      type: object
