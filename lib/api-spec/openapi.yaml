            minimum: 1
            maximum: 100
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Newline-delimited catalog, verified-result, and completion events
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/PartsCatalogSearchStreamEvent"
